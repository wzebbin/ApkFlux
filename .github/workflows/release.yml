name: Apple Silicon release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify target and version
        run: |
          test "$(uname -m)" = arm64
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:mac
      - name: Verify DMG and generate SHA-256
        run: |
          cd release
          dmg="ApkFlux-${GITHUB_REF_NAME#v}-mac-arm64.dmg"
          hdiutil verify "$dmg"
          mount="$(mktemp -d "$RUNNER_TEMP/apkflux-mount.XXXXXX")"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount"' EXIT
          bundle="$mount/ApkFlux.app"
          codesign --verify --deep --strict "$bundle"
          test "$(lipo -archs "$bundle/Contents/MacOS/ApkFlux")" = arm64
          test "$(plutil -extract CFBundleShortVersionString raw "$bundle/Contents/Info.plist")" = "${GITHUB_REF_NAME#v}"
          test ! -e "$bundle/Contents/Resources/app-update.yml"
          shasum -a 256 "$dmg" > SHA256SUMS.txt
      - name: Publish verified assets on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="ApkFlux-${GITHUB_REF_NAME#v}-mac-arm64.dmg"
          gh release create "$GITHUB_REF_NAME" "release/$dmg" release/SHA256SUMS.txt \
            --verify-tag --latest --title "ApkFlux $GITHUB_REF_NAME · Apple Silicon" \
            --notes-file docs/github-release.md
