name: Apple Silicon release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-15
    environment: macos-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify target and version
        run: |
          test "$(uname -m)" = arm64
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Sign, notarize and upload a draft
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          : "${CSC_LINK:?Missing Developer ID certificate}"
          : "${CSC_KEY_PASSWORD:?Missing certificate password}"
          : "${APPLE_API_KEY_BASE64:?Missing notarization API key}"
          : "${APPLE_API_KEY_ID:?Missing notarization key ID}"
          : "${APPLE_API_ISSUER:?Missing notarization issuer}"
          umask 077
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$APPLE_API_KEY"
          ./node_modules/.bin/electron-builder --mac --arm64 --publish always \
            -c.forceCodeSigning=true -c.mac.notarize=true \
            -c.publish.provider=github -c.publish.owner=wzebbin -c.publish.repo=ApkFlux -c.publish.releaseType=draft
