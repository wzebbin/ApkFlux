<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171a20">
  <meta name="description" content="ApkFlux 是面向 Apple Silicon Mac 的本地 Android APK 工作台。">
  <title>ApkFlux · 本地 Android APK 工作台</title>
  <link rel="icon" href="assets/icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="shell header">
    <a class="brand" href="./"><img src="assets/icon.png" alt="" width="34" height="34"> ApkFlux</a>
    <nav aria-label="网站导航"><a href="#features">功能</a><a href="https://github.com/wzebbin/ApkFlux">GitHub</a></nav>
  </header>
  <main class="shell">
    <section class="hero">
      <div class="intro">
        <p class="platform">Apple Silicon macOS</p>
        <h1>Android APK<br>本地工作台</h1>
        <p class="summary">查看包信息、浏览反编译结果、编辑工作副本，并构建已签名的 APK。</p>
        <a class="download" href="https://github.com/wzebbin/ApkFlux/releases">查看下载版本</a>
      </div>
      <figure class="preview"><img src="assets/workbench.png" width="1440" height="828" alt="ApkFlux 编辑器打开清单、Java 和 Smali 的界面"></figure>
    </section>
    <section id="features" class="features">
      <h2>在一个工作区完成 APK 检查与编辑</h2>
      <div class="feature-grid">
        <article><h3>浏览和搜索</h3><p>查看原始 APK、反编译 Java、Smali、资源与清单。跨来源搜索并定位到文件或代码行。</p></article>
        <article><h3>编辑和构建</h3><p>多标签保留各自的编辑状态。保存到工作副本后，可以重建、对齐、签名并验签。</p></article>
        <article><h3>分析与版本对比</h3><p>对比文件和权限，检查 SDK 与 SO，导出 HTML、JSON 或 CSV 报告。</p></article>
      </div>
    </section>
  </main>
  <footer class="shell footer"><span>ApkFlux</span><a href="https://github.com/wzebbin/ApkFlux/releases">发布记录</a></footer>
</body>
</html>
